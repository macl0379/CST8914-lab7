<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Form validation with messages on top: Code example - Accessibility Developer Guide example</title>
        <meta charset="utf-8">
        <style>.control, fieldset {
      margin: 6px 0;
    }
    
    label {
      display: inline-block;
      width: 120px;
      vertical-align: top;
    }
    
    input + label {
      width: auto;
    }
    /* add colour to error fieldset and messages */
    .error, .required, .errors li, fieldset.errors legend {
      color: red;
    }
    fieldset.errors legend{
      font-weight: bold;
    }

    fieldset.errors{
      border-color: red;
    }
    
    fieldset ul {
      margin: 0;
    }

    textarea{
      width: 300px;
      height: 150px;
      max-width: 90%;
    }
    
    </style>
    </head>
    <body>

        <h1>Feedback form</h1>
        <!-- Add instructions for form -->
        <span>All labels with <span aria-hidden="true"><span class="required" aria-hidden="true">*</span>required</span> must be filled </span>
<form>
    <div class="control">
          <!-- Add required and aria hidden to asterix span -->
          <label for="name">Full name <span aria-hidden="true"><span class="required" aria-hidden="true">*</span>required</span></label>
          <input id="name" name="name" type="text" placeholder="Enter your full name"/>
        </div>
        <div class="control">
          <label for="biography">Biography <span aria-hidden="true"><span class="required" aria-hidden="true">*</span>required</span></label>
          <textarea id="biography" name="biography" type="text" placeholder="Tell us about yourself, include examples of your skills in JavaScript."></textarea>
          <!-- Convert text to placeholder which can be read by screen reader
          <span>Include examples on your skills in JavaScript.</span> -->
        </div>
        <!-- Change to fieldset -->
         <fieldset>
          <!-- Change to legend -->
          <legend>Gender</legend>
          <span aria-hidden="true"><span class="required" aria-hidden="true">*</span>required</span>
          <div class="control">
            <!-- Add label for male -->
              <input id="gender_male" name="gender" type="radio" value="male" />
              <label for="gender_male">Male</label>
            </div>
            <div class="control">
              <!-- Add label for female -->
              <input id="gender_female" name="gender" type="radio" value="female" />
              <label for="gender_female">Female</label>
             </label>
          </div>
        </fieldset>
        
        <div class="control">
          <input id="accept_agbs" name="accept_agbs" type="checkbox" value="1" />
          <!-- Add required label -->
          <label for="accept_agbs">I accept the terms and conditions <span aria-hidden="true"><span class="required" aria-hidden="true">*</span>required</span></label>
        </div>
        <div class="control">
          <input name="validate" type="hidden" value="1" />
          <input type="submit" value="Register" />
        </div>
      </form>

      
          <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
          <script>"use strict";
      
      ;
      (function () {
        var validateInput;
      
        $.urlParam = function (name) {
          var results;
          results = new RegExp('[?&]' + name + '=([^&#]*)').exec(window.location.href);
      
          if (results === null) {
            return null;
          } else {
            return decodeURI(results[1]) || null;
          }
        };
      
        validateInput = function validateInput(input, message) {
          var $elementToDescribe, $error, $errorContainer, $fieldset, $input, $referencedElement, value;
          $input = $('[name="' + input + '"]');
      
          if ((value = $.urlParam(input)) === null) {
            if ($('fieldset.errors').length === 0) {
              $('form').prepend('<fieldset class="errors" role="alert"><legend>Errors</legend><ul></ul></fieldset>');
            }
      
            $referencedElement = null;
            $elementToDescribe = null;
            $errorContainer = $('fieldset.errors ul');
      
            if ($input.is(':radio')) {
              $fieldset = $input.closest('fieldset');
              $elementToDescribe = $fieldset;
              $referencedElement = $input.filter(':first');
            } else {
              $elementToDescribe = $input;
              $referencedElement = $input;
            }
            // add id of error for reference to correct error
            $error = $('<a href="#' + input + '">' + message + '</a>');
            $error.click(function (e) {
              // If we rely on the link's href pointing to the input's ID, it doesn't trigger forms mode in screen readers
              $referencedElement.focus();
              return e.preventDefault();
            });

            $elementToDescribe.attr('aria-describedby', input + '_description');
            $errorContainer.append('<li>').find('li:last').append($error);

            if ($(':not(form):focus').length === 0) {
              // See https://stackoverflow.com/questions/46134247/jquery-setting-focus-doesnt-work-in-ie11/
              var item = $referencedElement[0];
              // create new element for error and add message with styling
              var newLabel = document.createElement("label");
              newLabel.textContent = message;
              newLabel.classList.add('error');
              $input.parent().before(newLabel);
            }
          } else {
            if ($input.is(':checkbox')) {
              $input.attr('checked', true);
            }
      
            if ($input.is(':radio')) {
              return $input.filter('[value="' + value + '"]').attr('checked', true);
            } else {
              return $input.val(value);
            }
          }
        };
      
        $(document).ready(function () {
          if ($.urlParam('validate')) {
            validateInput('name', 'Please enter your name!');
            validateInput('biography', 'Please tell us something about your history!');
            validateInput('gender', 'Please tell us your gender!');
            validateInput('accept_agbs', 'You must accept our terms and conditions!');
      
            // Errors create fieldset with errors class not error
            // if ($('.error').length === 0) {
            if ($('.errors').length === 0) {
              return alert('All inputs are valid.');
            }
          }
        });
      }).call(void 0);</script>
                
        </body>
      </html>
